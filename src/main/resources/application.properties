spring.application.name=cleantrack

spring.datasource.url=jdbc:h2:mem:cleantrack;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Frontend types (cleaner_name, tasks_total, is_active, ...) are snake_case;
# each entity has explicit @JsonProperty("snake_case") annotations for this
# (the global spring.jackson.property-naming-strategy=SNAKE_CASE setting was
# tried here but did not take effect in this Spring Boot version).

# JWT signing key for admin auth. The fallback below is fine for local dev
# only (it's committed, so anyone with the repo can forge tokens) - set a
# real JWT_SECRET env var for anything beyond your own machine.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef0123456789abcdef}
app.jwt.expiration-minutes=720

# Local-disk storage for issue photos (see FileStorageService). Relative to
# the working directory the app is started from.
app.upload.dir=${UPLOAD_DIR:uploads/issue-photos}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
